name: Deploy to Docker Swarm trial

on:
  push:
    branches: ["main"] # Adjust as needed
# ghcr.io/hungvutourchain/tourchain-net/hoteltourportal:latest
env:
  RESISTRY: ghcr.io
  IMAGE_NAME: hungvutourchain/hoteltourportal:latest
  GHCR_USERNAME: ${{ github.actor }}
  IP: 159.89.193.175
  # IP: 178.128.86.194
  GHCR_PAT: ${{ secrets.GHCR_PAT }}
  SSH: ${{ secrets.SSH_PRIVATE_KEY }}
jobs:
  publish:
    name: publish image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v3
      - name: Login to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker build -f Dockerfileprodmanager . --tag ${{ env.RESISTRY }}/${{ env.IMAGE_NAME }}
          docker push ${{ env.RESISTRY }}/${{ env.IMAGE_NAME }}

  deploy:
    needs: publish
    name: Deploy to Docker Swarm
    runs-on: ubuntu-latest
    steps:
      - name: install ssh keys
        run: |
          install -m 600 -D /dev/null ~/.ssh/id_rsa
          echo "${{ env.SSH }}" > ~/.ssh/id_rsa
          ssh-keyscan -H ${{ env.IP }} > ~/.ssh/known_hosts
      - name: Connect and pull docker image
        run: |
          if [ -z "${{ env.GHCR_PAT }}" ]; then
            echo "GHCR_PAT is empty. Please set repository secret GHCR_PAT." >&2
            exit 1
          fi
          ssh root@${{ env.IP }} "set -e; docker logout ghcr.io || true; echo '${{ env.GHCR_PAT }}' | docker login ghcr.io -u '${{ env.GHCR_USERNAME }}' --password-stdin; docker pull '${{ env.RESISTRY }}/${{ env.IMAGE_NAME }}'; cd /host/tourchain/develop && docker stack deploy --compose-file docker-compose-accountant.yml tourchain --with-registry-auth"
      - name: cleanup
        run: rm -rf ~/.ssh
