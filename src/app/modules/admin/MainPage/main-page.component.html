<section class="main-page-layout">
  <aside class="left-menu">
    <div class="menu-header">
      <h2 class="bilingual heading-bilingual"><span class="en-text">Main Page</span><span class="vi-text">Trang chính</span></h2>
      <p class="bilingual desc-bilingual"><span class="en-text">Sub-page navigation center</span><span class="vi-text">Trung tâm điều hướng các trang con</span></p>
    </div>

    <nav class="menu-list">
      <a
        *ngFor="let item of menuItems"
        [routerLink]="[item.route]"
        routerLinkActive="active"
        class="menu-item"
      >
        <span class="menu-title bilingual"><span class="en-text">{{ item.enLabel }}</span><span class="vi-text">{{ item.viLabel }}</span></span>
        <span class="menu-description bilingual"><span class="en-text">{{ item.enDescription }}</span><span class="vi-text">{{ item.viDescription }}</span></span>
      </a>
    </nav>
  </aside>

  <main class="content-panel">
    <router-outlet></router-outlet>
  </main>
</section>
