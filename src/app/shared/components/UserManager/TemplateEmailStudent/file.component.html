<table class="table table-hover table-bordered table-striped table-condensed flip-content">
    <thead>
        <tr>
            <th> Search</th>
            <th colspan="5">
                <input type="text" class="form-control " [(ngModel)]="searchText" placeholder="text ... " style="width: 100%;
                border: none;
                height: 16px;
                font-size: 11px;">
            </th>
        </tr>
        <tr>
            <th class="flip-content clsControl" style="width: 30px;">No.</th>
            <th class="flip-content">Name</th>
            <th class="flip-content">Type</th>
            <th class="clsControl" style="width: 60px;">
                <a href="javascript:;" class="btn btn-icon-only" (click)="objectValue('new',null)">
                    <b>New</b>
                </a>
            </th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let x of lsobject | filter: searchText; let $index = index">
            <td class="clsControl">{{$index + 1}}</td>
            <td>{{x.name}}</td>
            <td>{{x.types}}</td>
            <td class="clsVerMid clsControl">
                <a href="javascript:;" class="btn btn-icon-only red" (click)="objectValue('edit',x)">
                    <i class="fa fa-edit"></i>
                </a>
                <a href="javascript:;" class="btn btn-icon-only purple" (click)="objectValue('delete',x)">
                    <i class="fa fa-times"></i>
                </a>
            </td>
        </tr>
    </tbody>
</table>

<ejs-dialog *ngIf="openDialog" [isModal]="true" [visible]='true' [header]="'edit Template'" [showCloseIcon]='true'
  [header]="'Content'" (close)="objectValue('cancel',object)"
  [width]="'835px'">
  <ng-template #content>
    <div class="row">
        <div class="col-md-12 mb-1">
            <table class="table table-hover table-bordered table-striped table-condensed flip-content">
                <thead>
                    <tr>
                        <th style="width: 50px;"><b>Type</b></th>
                        <th><b>Key</b></th>
                    </tr>
                </thead>
                <tr>
                    <td>Info User</td>
                    <td>
                        [#UserCode#] [#FullName#] [#UserCompany#] [#UserCourse#]
                    </td>
                </tr>
                <tr>
                    <td>Login</td>
                    <td style="color: red;">
                        [#UserName#] [#Password#]
                    </td>
                </tr>
            </table>
        </div>
        <div class="col-md-10">
            <fieldset class="form-group">
                <label class="form-label">Name</label>
                <input [(ngModel)]="object.name" type="text" class="form-control" placeholder="Enter name">
            </fieldset>
        </div>
        <div class="col-md-2">
            <fieldset class="form-group">
                <label class="form-label">Type Email </label>
                <kendo-dropdownlist [data]="lsTypesEmail" [textField]="'name'" [valueField]="'value'"
                    [valuePrimitive]="true" style="width: 100%" [(ngModel)]="object.types">
                </kendo-dropdownlist>
            </fieldset>
        </div>
        <div class="col-md-12">
            <fieldset class="form-group">
                <label class="form-label">Content</label>
                <editer-syncfusion style="width: 100%;" [(str)]="object.content"></editer-syncfusion>
            </fieldset>
        </div>

        <div class="col-md-12" style="display: flex; justify-content: flex-end; gap: 8px; padding-top: 14px; border-top: 1px solid #e0e0e0; margin-top: 14px;">
            <button class="btn btn-secondary btn-sm" (click)="objectValue('cancel',object)">Close</button>
            <button class="btn btn-primary btn-sm" (click)="objectValue(cSave?'save':'add',object)">{{cSave? 'Change' :
                'Add'}}</button>
        </div>
    </div>
  </ng-template>
</ejs-dialog>
